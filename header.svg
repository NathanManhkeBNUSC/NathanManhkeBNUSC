<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Nathan Manhke — Full Stack Developer">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
    .dim  { fill: #4F6F94; }
    .acc  { fill: #8FBFFF; }
    .ink  { fill: #E6F0FF; }
    .ok   { fill: #7EE2B8; }

    .l1 { clip-path: inset(0 100% 0 0); animation: type 1.1s steps(18) .3s forwards; }
    .l2 { opacity: 0; animation: show .5s ease-out 1.6s forwards; }
    .l3 { opacity: 0; animation: show .5s ease-out 2.1s forwards; }
    .l4 { clip-path: inset(0 100% 0 0); animation: type 1.8s steps(42) 2.8s forwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .glow { animation: pulse 6s ease-in-out infinite; }

    @keyframes type  { to { clip-path: inset(0 0 0 0); } }
    @keyframes show  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: .9; } }
  </style>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8FBFFF" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#8FBFFF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8FBFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#E6F0FF"/>
      <stop offset="1" stop-color="#8FBFFF"/>
    </linearGradient>
    <clipPath id="win"><rect x="0" y="0" width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="1200" height="340" fill="#012034"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect class="glow" width="1200" height="340" fill="url(#halo)"/>

    <!-- barra da janela -->
    <rect width="1200" height="44" fill="#011A2B"/>
    <circle cx="28" cy="22" r="6" fill="#FF6B6B"/>
    <circle cx="50" cy="22" r="6" fill="#FFC861"/>
    <circle cx="72" cy="22" r="6" fill="#7EE2B8"/>
    <text x="600" y="27" text-anchor="middle" class="mono dim" font-size="13">nathan@manhke: ~/github</text>

    <!-- terminal -->
    <g class="mono" font-size="18">
      <text x="56" y="96" class="l1"><tspan class="ok">$</tspan><tspan class="acc"> ~</tspan><tspan class="ink"> whoami</tspan></text>
    </g>

    <g class="l2">
      <text x="54" y="172" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-weight="800" font-size="68" letter-spacing="-1.5" fill="url(#name)">Nathan Manhke</text>
    </g>

    <g class="l3 mono" font-size="20">
      <text x="56" y="214"><tspan class="acc">Full Stack Developer</tspan><tspan class="dim">  ·  </tspan><tspan class="ink">Sistemas para Internet</tspan></text>
    </g>

    <g class="mono" font-size="18">
      <text x="56" y="282" class="l4"><tspan class="ok">$</tspan><tspan class="acc"> ~</tspan><tspan class="ink"> echo "do banco de dados ao deploy"</tspan><tspan class="acc cursor"> _</tspan></text>
    </g>

    <!-- bloco decorativo de código à direita -->
    <g class="mono" font-size="15" opacity=".9">
      <text x="820" y="104" class="dim">// stack.ts</text>
      <text x="820" y="134"><tspan class="acc">const</tspan><tspan class="ink"> stack = {</tspan></text>
      <text x="844" y="162"><tspan class="ink">front: </tspan><tspan class="ok">["TS", "JS", "HTML", "CSS"]</tspan><tspan class="ink">,</tspan></text>
      <text x="844" y="190"><tspan class="ink">back:  </tspan><tspan class="ok">["Python", "PHP"]</tspan><tspan class="ink">,</tspan></text>
      <text x="844" y="218"><tspan class="ink">data:  </tspan><tspan class="ok">["MySQL", "Postgres"]</tspan><tspan class="ink">,</tspan></text>
      <text x="844" y="246"><tspan class="ink">cloud: </tspan><tspan class="ok">["Vercel", "Cloudflare"]</tspan></text>
      <text x="820" y="274" class="ink">};</text>
    </g>

    <rect x="0" y="338" width="1200" height="2" fill="#8FBFFF" opacity=".5"/>
  </g>
</svg>
